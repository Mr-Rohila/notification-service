<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/fragments/email-layout :: layout('Email Verification | TubeTasks', ~{::section})}">
<section>
    <h1>Email Verification</h1>
    <p th:text="'Hi, ' + ${displayName}">Hi,</p>
    <p>Thank you for registering with us. Please click the button below to verify your email address and complete the registration process.</p>
    <div class="button-container">
        <a th:href="${actionUrl}" class="button" style="color: #ffffff;">Verify Email</a>
    </div>
    <p>If you didn't create an account using this email address, please ignore this email.</p>
</section>
</html>
