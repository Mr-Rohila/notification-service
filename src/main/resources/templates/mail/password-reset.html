<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Reset your password</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.5; color: #222;">
<p>Hi <span th:text="${displayName}">there</span>,</p>
<p>We received a request to reset your TubeTasks password. Click the link below to continue:</p>
<p><a th:href="${actionUrl}" th:text="${actionUrl}">Reset password</a></p>
<p>This link expires at <span th:text="${tokenExpiresAt}">expiry</span> (UTC).</p>
<p th:if="${supportEmail != null}">Need help? Contact us at <span th:text="${supportEmail}">support</span>.</p>
<p>If you did not request a password reset, you can ignore this email.</p>
</body>
</html>
