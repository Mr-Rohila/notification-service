<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{mail/fragments/email-layout :: layout('Deposit approved | TubeTasks', ~{::section})}">
<section>
    <h1>Deposit approved</h1>
    <p th:text="'Hi, ' + ${displayName}">Hi,</p>
    <p>Your deposit has been approved and credited to your TubeTasks wallet.</p>
    <p>
        Amount: <strong th:text="${amount} + ' ' + ${currency}">0.00 INR</strong>
    </p>
    <p>Reference: <span th:text="${transactionId}">txn-id</span></p>
    <p th:if="${supportEmail != null}">Need help? Contact us at <span th:text="${supportEmail}">support</span>.</p>
</section>
</html>
