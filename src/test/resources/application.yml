spring:
  application:
    name: notification-service
  profiles:
    active: test
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
      fail-fast: false
      import-check:
        enabled: false
    function:
      definition: notificationEvents
    stream:
      default-binder: test
      bindings:
        notificationEvents-in-0:
          destination: tubetasks.notification.events
          group: notification-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:notification;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 3025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/auth

eureka:
  client:
    enabled: false

server:
  port: 0

notification-service:
  mail:
    from: noreply@tubetasks.in
    from-name: TubeTasks
    allowed-action-url-prefixes:
      - http://localhost:9000/auth
  templates:
    EMAIL_VERIFICATION_REQUESTED:
      name: registration-verification
      subject: Verify your TubeTasks email
    PASSWORD_RESET_REQUESTED:
      name: password-reset
      subject: Reset your TubeTasks password
    ACCOUNT_ACTIVATED:
      name: welcome
      subject: Welcome to TubeTasks — your account is ready
    PAYMENT_SUBMITTED:
      name: payment-submitted
      subject: We received your TubeTasks deposit request
    PAYMENT_APPROVED:
      name: payment-approved
      subject: Your TubeTasks deposit was approved
    PAYMENT_REJECTED:
      name: payment-rejected
      subject: Your TubeTasks deposit was not approved
    WITHDRAWAL_CREATED:
      name: withdrawal-created
      subject: We received your TubeTasks withdrawal request
    WITHDRAWAL_APPROVED:
      name: withdrawal-approved
      subject: Your TubeTasks withdrawal was approved
    WITHDRAWAL_REJECTED:
      name: withdrawal-rejected
      subject: Your TubeTasks withdrawal was not approved
    SUBSCRIPTION_PURCHASED:
      name: subscription-purchased
      subject: Your TubeTasks campaign is active
    CAMPAIGN_COMPLETED:
      name: campaign-completed
      subject: Your TubeTasks campaign is complete
    ADMIN_WALLET_CREDITED:
      name: admin-wallet-credited
      subject: Wallet credited
  retention:
    processed-event-days: 30
    delivery-days: 90
    cleanup-cron: "0 30 3 * * *"
  consumer-enabled: true
  send-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  file:
    name: ./target/test-logs/notification-service.log
