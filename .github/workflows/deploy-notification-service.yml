name: Deploy Notification Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    environment: dev

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application
        run: |
          chmod +x mvnw
          ./mvnw clean package

      - name: List generated JAR
        run: |
          ls -lh target/*.jar

      - name: Remove previous release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            rm -f /home/ubuntu/notification-service/releases/notification-service*.jar

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/notification-service/releases/"
          strip_components: 1

      - name: Restart Notification Service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/notification-service"
            RELEASE_DIR="$APP_DIR/releases"

            echo "Uploaded files:"
            ls -lh "$RELEASE_DIR"

            JAR=$(ls -t "$RELEASE_DIR"/*.jar | head -n 1)

            echo "Using JAR: $JAR"

            cp "$JAR" "$APP_DIR/app.jar"

            sudo chown ubuntu:ubuntu "$APP_DIR/app.jar"
            sudo chmod 664 "$APP_DIR/app.jar"

            sudo systemctl restart notification-service

            sleep 10

            sudo systemctl is-active --quiet notification-service

            echo "Notification Service deployed successfully!"
